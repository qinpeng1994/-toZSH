

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>zsh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  .content {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 20px;
    pointer-events: none;
  }
  .name {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    background: linear-gradient(90deg, #ff1493, #ff69b4, #ff1493, #ff69b4);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradient 6s linear infinite, scaleIn 1.5s ease-out forwards 0.5s;
    opacity: 0;
    margin-bottom: 0.5rem;
    text-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
    letter-spacing: 2px;
    will-change: transform, opacity;
  }

  .text {
    font-size: clamp(0.9rem, 2.5vw, 1.3rem);
    line-height: 1.5;
    max-width: 75%;
    opacity: 0;
    animation: fadeInUp 2s forwards 1.8s;
    background: linear-gradient(90deg, #ffb6c1, #ff69b4, #ffb6c1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 500;
    margin-top: 0.5rem;
    will-change: transform, opacity;
  }

  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .love-text {
    position: absolute;
    font-size: 1.5rem;
    color: #ffffff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    animation: floatUp 2.5s forwards;
    font-weight: 600;
    will-change: transform, opacity;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.1); }
  }

  /* 避让空间 */
  .spacer {
    flex: 1;
    min-height: 12rem;
  }

  /* 中心跳动红心 - 使用CSS动画优化 */
  .center-heart {
    position: absolute;
    font-size: clamp(6rem, 20vw, 12rem);
    color: #ff0000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    animation: heartbeat 1.2s ease-in-out infinite, glow-heart 2s ease-in-out infinite alternate;
    text-shadow: 0 0 30px rgba(255, 0, 0, 0.8), 0 0 60px rgba(255, 0, 0, 0.5);
    pointer-events: auto;
    cursor: pointer;
    will-change: transform;
    transition: transform 0.1s ease;
    user-select: none;
  }

  .center-heart:active {
    transform: translate(-50%, -50%) scale(0.95);
  }

  @keyframes heartbeat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    15% { transform: translate(-50%, -50%) scale(1.1); }
    30% { transform: translate(-50%, -50%) scale(1); }
    45% { transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes glow-heart {
    0% { text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.5); }
    100% { text-shadow: 0 0 40px rgba(255, 0, 0, 1), 0 0 80px rgba(255, 0, 0, 0.7), 0 0 100px rgba(255, 0, 0, 0.4); }
  }

  /* 触摸波纹效果 */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,105,180,0.6) 0%, transparent 70%);
    pointer-events: none;
    animation: rippleAnim 0.8s ease-out forwards;
    will-change: transform, opacity;
  }

  @keyframes rippleAnim {
    0% { width: 0; height: 0; opacity: 1; }
    100% { width: 150px; height: 150px; opacity: 0; margin-left: -75px; margin-top: -75px; }
  }

  /* 长按指示器 */
  .hold-indicator {
    position: fixed;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid rgba(255, 105, 180, 0.8);
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .hold-indicator.active {
    opacity: 1;
    animation: holdPulse 1s ease-in-out infinite;
  }

  @keyframes holdPulse {
    0%, 100% { transform: scale(0.8); border-color: rgba(255, 105, 180, 0.4); }
    50% { transform: scale(1.2); border-color: rgba(255, 105, 180, 1); }
  }

  /* 提示文字 */
  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
    z-index: 50;
    animation: hintFade 5s forwards;
    pointer-events: none;
  }

  @keyframes hintFade {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* 爱心爆炸效果 */
  .heart-burst {
    position: fixed;
    font-size: 2rem;
    pointer-events: none;
    z-index: 30;
    animation: burstUp 1s ease-out forwards;
    will-change: transform, opacity;
  }

  @keyframes burstUp {
    0% { opacity: 1; transform: scale(0) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.5) rotate(180deg); }
    100% { opacity: 0; transform: scale(0.5) rotate(360deg) translateY(-100px); }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="content">
  <div class="name" id="name"></div>
  <div class="spacer"></div>
  <div class="text" id="msg"></div>
  <div class="center-heart" id="heartElement">❤️</div>
</div>

<div class="hold-indicator" id="holdIndicator"></div>
<div class="hint">👆 点击屏幕任意处表达爱意</div>

<script>
  // ====================== 仅需修改这里 ======================
  const herName = "ZSH";
  const myWords = `❤️ ${herName} ❤️
章诗慧，我的宝，我爱你 ❤️`;
  // ==========================================================

  document.getElementById("name").innerText = `❤️ ${herName} ❤️`;
  document.getElementById("msg").innerText = myWords;

  // 画布初始化
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  const isMobile = w <= 768;

  window.addEventListener("resize", () => {
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
  });

  const rand = (min, max) => Math.random() * (max - min) + min;

  // 粒子类 - 优化版
  class Particle {
    constructor(x, y, type = "heart") {
      this.x = x;
      this.y = y;
      this.type = type;
      this.vx = rand(-3, 3);
      this.vy = rand(1, 4);
      this.alpha = rand(0.8, 1);
      this.decay = rand(0.01, 0.018);
      this.color = ["#ff1493", "#ff69b4", "#ff6b9d", "#ffb6c1"][Math.floor(rand(0, 4))];
      this.size = rand(8, 16);
      this.rotate = rand(0, 360);
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= this.decay;
      this.rotate += 3;
      this.vy += 0.03;
    }

    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.fillStyle = this.color;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotate * Math.PI / 180);
      ctx.scale(this.size / 20, this.size / 20);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(15, -15, 30, 0, 0, 20);
      ctx.bezierCurveTo(-30, 0, -15, -15, 0, 0);
      ctx.fill();
      ctx.restore();
    }
  }

  let particles = [];
  const MAX_PARTICLES = isMobile ? 150 : 300;

  // 爱心雨 - 优化
  let lastRainTime = 0;
  function createHeartRain(timestamp) {
    if (timestamp - lastRainTime < (isMobile ? 2000 : 1200)) return;
    lastRainTime = timestamp;

    const heartCount = particles.filter(p => p.type === "heart").length;
    if (heartCount > (isMobile ? 20 : 40)) return;

    const count = isMobile ? 8 : 15;
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(rand(0, w), rand(-150, -30)));
    }
  }

  // 爱心形状开场
  function createHeartShape() {
    if (particles.length > MAX_PARTICLES * 0.5) return;
    const cx = w / 2, cy = h / 2;
    const count = isMobile ? 100 : 200;
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const scale = rand(0.3, 1);
      const x = 16 * Math.pow(Math.sin(angle), 3);
      const y = -(13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle));
      particles.push(new Particle(cx + x * 20 * scale, cy + y * 20 * scale));
    }
  }

  // 动画主循环
  function animate(timestamp) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    ctx.fillRect(0, 0, w, h);

    createHeartRain(timestamp);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.update();
      p.draw();
      if (p.alpha <= 0) particles.splice(i, 1);
    }

    if (particles.length > MAX_PARTICLES) {
      particles = particles.slice(-MAX_PARTICLES);
    }

    requestAnimationFrame(animate);
  }

  animate();
  setTimeout(createHeartShape, 500);

  // ========== 交互系统 ==========
  let clickCount = 0;
  let rapidClicks = 0;
  let lastClickTime = 0;
  let holdTimer = null;
  let isHolding = false;

  const messages = {
    playful: ["你点我一下，我心跳一下~", "再点一下嘛~", "点点更健康哦~", "你点得我好开心", "调皮鬼~"],
    like: ["其实...我有点喜欢你了", "每次你点我，我都很开心", "你是最特别的人", "想和你分享每一个瞬间"],
    love: ["我想我是真的爱上你了", "你占据了我整个心", "想和你走过每一天", "你的笑容是我最大的幸福"],
    forever: ["我想和你永远在一起", "你就是我要找的人", "愿意用一生爱你", "你是我的唯一"]
  };

  const loveWords = ["❤️", "💕", "💗", "💖", "💝", "🌸", "✨", "💫", "🦋", "🌙"];

  // 触摸波纹
  function createRipple(x, y) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 800);
  }

  // 爱心爆炸
  function createHeartBurst(x, y) {
    const count = isMobile ? 5 : 8;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'heart-burst';
      el.textContent = loveWords[Math.floor(Math.random() * loveWords.length)];
      el.style.left = (x + rand(-30, 30)) + 'px';
      el.style.top = (y + rand(-30, 30)) + 'px';
      el.style.animationDelay = rand(0, 0.3) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }
  }

  // 创建漂浮文字
  function createFloatingText(x, y, text, color = '#fff', size = 18) {
    const el = document.createElement('div');
    el.className = 'love-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.style.animation = 'floatUp 2.5s forwards';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  // 获取消息
  function getMessage(count) {
    let pool;
    if (count <= 10) pool = messages.playful;
    else if (count <= 30) pool = messages.like;
    else if (count <= 50) pool = messages.love;
    else pool = messages.forever;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  const holdIndicator = document.getElementById('holdIndicator');
  const heartElement = document.getElementById('heartElement');

  // 长按事件
  function startHold(x, y) {
    isHolding = true;
    holdIndicator.style.left = (x - 30) + 'px';
    holdIndicator.style.top = (y - 30) + 'px';
    holdIndicator.classList.add('active');

    holdTimer = setTimeout(() => {
      if (isHolding) {
        createHeartBurst(x, y);
        createFloatingText(x, y - 30, "长按真好~ 爱你 ❤️", '#ffff00', 22);
        for (let i = 0; i < 20; i++) {
          particles.push(new Particle(x + rand(-50, 50), y + rand(-50, 50)));
        }
      }
    }, 600);
  }

  function endHold(x, y) {
    isHolding = false;
    holdIndicator.classList.remove('active');
    if (holdTimer) {
      clearTimeout(holdTimer);
      holdTimer = null;
    }
  }

  // 中心红心点击
  heartElement.addEventListener('click', (e) => {
    e.stopPropagation();
    createHeartBurst(w/2, h/2 - 50);
    for (let i = 0; i < 30; i++) {
      const angle = rand(0, Math.PI * 2);
      const dist = rand(50, 150);
      particles.push(new Particle(w/2 + Math.cos(angle) * dist, h/2 + Math.sin(angle) * dist));
    }
    createFloatingText(w/2, h/2 - 120, "永远爱你 ❤️", '#ffff00', 28);
  });

  // 触摸事件
  document.body.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    const x = touch.clientX;
    const y = touch.clientY;

    createRipple(x, y);

    const now = Date.now();
    if (now - lastClickTime < 500) {
      rapidClicks++;
      if (rapidClicks >= 3) {
        // 三击彩蛋
        rapidClicks = 0;
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            particles.push(new Particle(rand(0, w), rand(0, h)));
          }, i * 30);
        }
        createFloatingText(w/2, h/2, "❤️ 彩蛋触发！ ❤️", '#ff69b4', 26);
        return;
      }
    } else {
      rapidClicks = 1;
    }
    lastClickTime = now;

    startHold(x, y);
  }, { passive: true });

  document.body.addEventListener('touchend', (e) => {
    const touch = e.changedTouches[0];
    endHold(touch.clientX, touch.clientY);
  }, { passive: true });

  document.body.addEventListener('touchmove', () => {
    if (holdTimer) {
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        if (isHolding) {
          const touch = event.touches[0];
          createHeartBurst(touch.clientX, touch.clientY);
        }
      }, 600);
    }
  }, { passive: true });

  // 点击事件（兼容鼠标）
  document.body.addEventListener('click', (e) => {
    // 忽略中心红心的点击
    if (e.target === heartElement) return;

    createRipple(e.clientX, e.clientY);

    const now = Date.now();
    if (now - lastClickTime < 500) {
      rapidClicks++;
      if (rapidClicks >= 3) {
        rapidClicks = 0;
        for (let i = 0; i < 30; i++) {
          setTimeout(() => particles.push(new Particle(rand(0, w), rand(0, h))), i * 30);
        }
        createFloatingText(w/2, h/2, "❤️ 彩蛋触发！ ❤️", '#ff69b4', 26);
        return;
      }
    } else {
      rapidClicks = 1;
    }
    lastClickTime = now;

    clickCount++;
    const msg = getMessage(clickCount);
    const colors = ['#ffffff', '#ffff00', '#ff69b4', '#ff1493'];
    createFloatingText(e.clientX, e.clientY, msg, colors[Math.floor(Math.random() * colors.length)]);

    // 随机生成少量粒子
    if (Math.random() > 0.7) {
      particles.push(new Particle(e.clientX, e.clientY));
    }
  });

  // 双击事件
  document.body.addEventListener('dblclick', (e) => {
    if (e.target === heartElement) return;
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      particles.push(new Particle(e.clientX + Math.cos(angle) * 40, e.clientY + Math.sin(angle) * 40));
    }
    createFloatingText(e.clientX, e.clientY, "双击捕获真心~ 💕", '#ff69b4', 22);
  });
</script>
</body>
</html>
